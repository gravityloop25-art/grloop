name: Apps bauen (Android-APK + Desktop)

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Adresse des gehosteten Dashboards (https://…). Leer = Repo-Variable APP_URL'
        required: false
  push:
    tags: ['apps-v*']

permissions:
  contents: write

env:
  APP_URL: ${{ inputs.app_url || vars.APP_URL }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Adresse prüfen
        run: |
          case "$APP_URL" in https://*) echo "App-Adresse: $APP_URL";; *) echo "::error::APP_URL fehlt oder ist nicht https://… (Repo-Variable APP_URL setzen oder beim Start eintragen)"; exit 1;; esac

  android:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: node scripts/make-config.js
      - run: npx cap add android
      - run: python3 scripts/patch-manifest.py
      - name: App-Icon erzeugen
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'
      - run: npx cap sync android
      - name: APK bauen (Debug-signiert, direkt installierbar)
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk GravityLoop.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: apps/android/GravityLoop.apk }

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Server-Adresse eintragen
        shell: bash
        run: |
          node -e "require('fs').writeFileSync('app-config.json', JSON.stringify({url: process.env.APP_URL}))"
      - run: npm ci
      - name: Installer bauen
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage

  release:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -R out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('apps-{0}', github.run_number) }}
          name: Gravity Loop Apps (Build ${{ github.run_number }})
          files: out/*
